name: Keno Predictor Auto-Update

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-predict:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests beautifulsoup4

    - name: Ejecutar Extractor y Predictor
      run: |
        python main.py

    - name: Guardar cambios en GitHub (Commit y Push)
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add keno_consolidado_unico.csv ultima_prediccion.txt index.html || true
        git diff --staged --quiet || (git commit -m "Auto-update Keno predictions" && git push)
