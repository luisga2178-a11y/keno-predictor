name: Keno Predictor Auto-Update

on:
  schedule:
    - cron: '*/30 * * * *'  # Corre automáticamente cada 30 minutos
  workflow_dispatch:        # Te permite ejecutarlo manualmente cuando quieras

jobs:
  update-and-predict:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests beautifulsoup4

    - name: Ejecutar Extractor y Predictor
      run: |
        python main.py

    - name: Guardar cambios en GitHub (Commit y Push)
      run: |
        git config --global user.name 'KenoBot'
        git config --global user.email 'kenobot@github.com'
        git add keno_consolidado_unico.csv ultima_prediccion.txt index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Keno [skip ci]" && git push)
